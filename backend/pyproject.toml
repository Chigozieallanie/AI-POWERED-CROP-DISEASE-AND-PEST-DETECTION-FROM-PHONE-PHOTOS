[project]
name = "crop-backend"
version = "0.1.0"
description = "Backend for the crop disease and pest detection app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-edge-litert>=1.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "numpy>=1.26",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqladmin>=0.20",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
